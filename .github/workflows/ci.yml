name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    name: compile every file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: make check PY=python
      # Syntax errors, undefined names and other mistakes that would crash at run time.
      - run: pip install ruff && ruff check --select E9,F63,F7,F82 src scripts tests
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { path: wildfire-ignition-forecasting }
      # Two tests import the live scoring code of the dashboard repository, which sits next to this one as ../website.
      - uses: actions/checkout@v7
        with: { repository: Terra-Watch/dashboard, path: website }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wildfire-ignition-forecasting/pyproject.toml
      # CPU-only torch keeps the install small. Tests that need the dataset or a built bundle skip themselves.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pandas scikit-learn xgboost pyarrow scipy PyYAML joblib matplotlib pytest
      - run: make test PY=python
        working-directory: wildfire-ignition-forecasting
