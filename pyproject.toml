[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire"
version = "0.0.0"
description = "Next-day wildfire ignition risk over Indian forest landscapes."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "xarray==2025.6.1",
  "netCDF4==1.7.4",
  "pyproj==3.7.1",
  "pyarrow==25.0.1",
  "torch==2.14.1",
  "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3", "pyflakes", "nbformat==5.11.1", "nbconvert==7.17.1", "nbclient==0.11.0", "ipykernel==7.3.0"]

[project.scripts]
wildfire = "wildfire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
